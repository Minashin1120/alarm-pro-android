name: Android CI

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle.properties'
      - 'ci/debug.keystore'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle.properties'
      - 'ci/debug.keystore'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Ensure valid Gradle wrapper jar
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p gradle/wrapper
          # Check if jar is valid (starts with PK zip magic)
          if ! file gradle/wrapper/gradle-wrapper.jar | grep -q 'Zip archive' 2>/dev/null && ! head -c 2 gradle/wrapper/gradle-wrapper.jar 2>/dev/null | grep -q $'\x50\x4b'; then
            echo "gradle-wrapper.jar is missing or invalid. Downloading official one..."
            curl -sL -o gradle/wrapper/gradle-wrapper.jar \
              https://github.com/gradle/gradle/raw/v9.3.1/gradle/wrapper/gradle-wrapper.jar
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f gradle/wrapper/gradle-wrapper.jar
            git commit -m "ci: add valid official gradle-wrapper.jar" || true
            git push || true
          else
            echo "Valid gradle-wrapper.jar already present"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create fixed debug keystore if missing
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p ci

          if [ -s ci/debug.keystore ]; then
            echo "Using existing fixed ci/debug.keystore"
            exit 0
          fi

          echo "ci/debug.keystore is missing. Generating it once..."

          keytool -genkeypair -v \
            -keystore ci/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f ci/debug.keystore
          git commit -m "ci: add fixed shared debug keystore"
          git push

      - name: Verify fixed debug keystore
        run: |
          if [ ! -s ci/debug.keystore ]; then
            echo "ERROR: ci/debug.keystore not found or empty"
            echo "Run Android CI on the default development branch once to bootstrap the fixed keystore."
            exit 1
          fi

          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

          keytool -list -v \
            -keystore ci/debug.keystore \
            -storepass android \
            -alias androiddebugkey

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
